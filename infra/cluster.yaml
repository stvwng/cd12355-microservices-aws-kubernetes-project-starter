# eksctl cluster definition: `eksctl create cluster -f infra/cluster.yaml`
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: coworking-cluster
  region: us-east-1
managedNodeGroups:
  - name: coworking-nodes
    # 2 vCPU / 2 GiB burstable: the API and Postgres idle far below this.
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    iam:
      withAddonPolicies:
        # Grants CloudWatchAgentServerPolicy so Container Insights can ship logs/metrics.
        cloudWatch: true
addons:
  # Installs the CloudWatch agent + Fluent Bit that power Container Insights.
  - name: amazon-cloudwatch-observability
cloudWatch:
  clusterLogging:
    enableTypes: []
