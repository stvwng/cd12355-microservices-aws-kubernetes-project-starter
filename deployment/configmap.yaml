# Non-sensitive settings shared by the analytics API and the Postgres pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coworking-config
data:
  DB_NAME: coworking
  DB_USERNAME: coworking
  # In-cluster DNS name of the Postgres Service (see postgresql-service.yaml).
  DB_HOST: postgresql-service
  DB_PORT: "5432"
